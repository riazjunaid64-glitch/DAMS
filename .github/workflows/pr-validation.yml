name: PR validation

on:
  pull_request:
  push:
    branches: [main, master, new-style]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Dams_ci_SQL_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dams_ci_SQL_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DAMS_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Dams_ci_SQL_2026!;Encrypt=False;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BACKEND/DAMS.sln
      - name: Build
        run: dotnet build BACKEND/DAMS.sln --configuration Release --no-restore
      - name: Test including SQL Server invariants
        run: dotnet test BACKEND/DAMS.Application.Tests/DAMS.Application.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: BACKEND/DAMS.Application.Tests/TestResults

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
