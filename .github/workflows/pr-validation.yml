name: PR validation

on:
  pull_request:
  push:
    branches: [main, master, new-style]

permissions:
  contents: read

jobs:
  backend:
    # Runs on Windows to match the development/hosting environment; the suite is validated on Windows
    # and some tests rely on Windows-specific behavior. (A Linux run surfaced an environment-specific
    # test failure that does not reproduce on Windows.)
    runs-on: windows-latest
    timeout-minutes: 25
    # This job runs the in-memory suite; SqlServerProductionInvariantTests skips itself here because
    # DAMS_SQLSERVER_TEST_CONNECTION is unset. Those tests are gated by the `sqlserver` job below,
    # which runs them against a real server — the in-memory provider does not enforce unique indexes
    # or check constraints and client-evaluates LINQ it cannot translate, so it cannot stand in for
    # migrations, filtered indexes, or the derived finance queries.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BACKEND/DAMS.sln
      - name: Build
        run: dotnet build BACKEND/DAMS.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BACKEND/DAMS.Application.Tests/DAMS.Application.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: BACKEND/DAMS.Application.Tests/TestResults

  # Migrations, filtered unique indexes, check constraints and the derived finance queries only
  # prove themselves against a real provider. Linux, because service containers do not run on the
  # Windows runners — and only this one test class, so the Windows-specific failures that keep the
  # main suite off Linux stay out of the way. ClientIdentitySqlTests joins it for the same
  # reason: the unique NormalizedEmail index and serialisable single-use redemption are the two
  # guarantees the in-memory provider cannot express at all.
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Dams(Test)Pa55w0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dams(Test)Pa55w0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test (real SQL Server invariants)
        env:
          DAMS_SQLSERVER_TEST_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Dams(Test)Pa55w0rd;TrustServerCertificate=true;Encrypt=false"
        run: >-
          dotnet test BACKEND/DAMS.Application.Tests/DAMS.Application.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~SqlServerProductionInvariantTests|FullyQualifiedName~ClientIdentitySqlTests"
          --logger "trx;LogFileName=sqlserver-tests.trx"
      # A connection failure would otherwise silently skip every test and report a green job.
      - name: Assert the suite actually ran
        shell: bash
        run: |
          trx=$(find BACKEND/DAMS.Application.Tests/TestResults -name 'sqlserver-tests.trx' | head -1)
          grep -q 'outcome="Passed"' "$trx" || { echo "::error::No SQL Server test executed"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlserver-test-results
          path: BACKEND/DAMS.Application.Tests/TestResults

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
