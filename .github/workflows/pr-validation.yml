name: PR validation

on:
  pull_request:
  push:
    branches: [main, master, new-style]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The real SQL Server invariant suite (SqlServerProductionInvariantTests) is deferred for now: it
    # is not run in CI. Without DAMS_SQLSERVER_TEST_CONNECTION it skips itself, so the build and the
    # full in-memory test suite still gate every PR. Re-add a `services: sqlserver` block and that env
    # var when we bring the SQL-Server checks back online.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BACKEND/DAMS.sln
      - name: Build
        run: dotnet build BACKEND/DAMS.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BACKEND/DAMS.Application.Tests/DAMS.Application.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: BACKEND/DAMS.Application.Tests/TestResults

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
